name: Scrape P-WORLD interview schedule

on:
  schedule:
    # 毎日 UTC 15:00 = JST 翌0:00 に実行
    - cron: "0 15 * * *"
  workflow_dispatch: {}

concurrency:
  group: pworld-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P-WORLD schedule scraper
        run: python3 pworld_schedule_scraper.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pworld_interviews.parquet
          git diff --cached --quiet || git commit -m "chore: P-WORLD schedule scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! git pull --rebase; then
            echo "::warning::pull --rebase failed (likely binary conflict in a parquet file). Discarding this run's commit and syncing to remote instead."
            git rebase --abort || true
            git reset --hard origin/main
            exit 0
          fi
          git push
