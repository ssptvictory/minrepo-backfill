name: Scrape unit bonus history (BB/RB)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: unit_bonus_history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNIT_BONUS_TIME_BUDGET: "700"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python3 scrape_unit_bonus_history.py

      - name: Commit data and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/unit_bonus_shards/ data/unit_bonus_progress.json
          git diff --cached --quiet || git commit -m "chore: unit bonus history scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! git pull --rebase; then
            echo "::warning::pull --rebase failed (likely binary conflict). Discarding this run's commit and syncing to remote instead."
            git rebase --abort || true
            git reset --hard origin/main
            exit 0
          fi
          git push
