name: Backfill unit bonus history (BB/RB, past dates)

# BB/RB過去分の取得(2026-11-24から最優先で開始)。
# - 起動はcron-job.orgから30分おきにworkflow_dispatch APIを呼ぶ
#   (Backfill min-repo dataと同じ方式)。
# - サイトへの負荷を抑えるため並列にせず1ジョブずつ。concurrencyで
#   実行中1本+待機1本までに抑える(待機中に来た起動は古い待機と入れ替わる)。
# - 1ジョブ内で45分ずつ区切って実行し、区切りごとにcommit/pushする
#   (途中で落ちても失うのは最大45分ぶん)。
# - レート制限で打ち切った場合は2時間の休止期限をcommitし、その間に
#   起動されても何もせず終了する。

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unit_bonus_backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      UNIT_BONUS_BACKFILL_TIME_BUDGET: "2700"
      UNIT_BONUS_BACKFILL_DAYS_BACK: "365"
    steps:
      # workflow_dispatchの既定では「起動された時点」のコミットが取り出される。
      # 待機していた実行が古い進捗で始まらないよう、ブランチの最新を取り出す。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill in 45-minute chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for chunk in 1 2 3 4 5 6; do
            UNIT_BONUS_BACKFILL_CHUNK=$chunk python3 -u backfill_unit_bonus_history.py
            git add data/unit_bonus_shards/ data/unit_bonus_backfill_progress.json
            [ -f data/unit_bonus_backfill_cooldown.json ] && git add data/unit_bonus_backfill_cooldown.json
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: unit bonus backfill chunk $chunk $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for i in 1 2 3 4 5 6 7 8; do
                if git pull -q --rebase && git push -q; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep $((RANDOM % 20 + 5))
              done
            fi
            if [ -f data/.unit_bonus_rate_limited ]; then
              echo "レート制限(または休止期間中)のため今回は終了"
              break
            fi
            remaining=$(python3 -c "import json;p=json.load(open('data/unit_bonus_backfill_progress.json'));print(sum(s['status']=='in_progress' for s in p.values()))")
            echo "未完了ホール: $remaining"
            if [ "$remaining" = "0" ]; then break; fi
          done
