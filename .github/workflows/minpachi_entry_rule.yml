name: Scrape minpachi entry rules (for unconfirmed halls)

on:
  schedule:
    # パチ7・p-town・P-WORLDの後、JST月曜10:00=UTC月曜1:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

concurrency:
  group: minpachi-entry-rule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run minpachi entry rule scraper
        run: python3 minpachi_entry_rule_scraper.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/minpachi_hall_rules.parquet
          git diff --cached --quiet || git commit -m "chore: minpachi entry rules refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! git pull --rebase; then
            echo "::warning::pull --rebase failed (likely binary conflict in a parquet file). Discarding this run's commit and syncing to remote instead."
            git rebase --abort || true
            git reset --hard origin/main
            exit 0
          fi
          git push
